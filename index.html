<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Western Suburbs Veterinary Clinic — Live Assistant</title>
<style>
  :root {
    --wsvc-primary: #204B7C;
    --wsvc-primary-dark: #163756;
    --wsvc-accent: #FFCC02;
    --wsvc-danger: #C0392B;
    --wsvc-bg: #ffffff;
    --wsvc-text: #1c1c1c;
    --wsvc-muted: #6b7280;
    --wsvc-border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  #wsvc-root, #wsvc-root * { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #wsvc-root {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 999999;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    /* Explicit width so absolutely-positioned children (the teaser bubble) get a
       full-width containing block for their shrink-to-fit calculation, instead of
       collapsing to the 64px launcher's width when the card is closed. */
    width: 360px;
    max-width: calc(100vw - 24px);
    pointer-events: none;
  }
  #wsvc-root > * { pointer-events: auto; }

  /* Launcher */
  #wsvc-launcher {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--wsvc-primary);
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    overflow: hidden;
    position: relative;
    transition: transform 0.2s ease;
  }
  #wsvc-launcher img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 50%;
    background: #fff;
  }
  #wsvc-launcher:hover { transform: scale(1.05); }
  #wsvc-launcher.wsvc-bounce { animation: wsvc-bounce-kf 0.7s ease; }
  @keyframes wsvc-bounce-kf {
    0% { transform: translateY(0); }
    30% { transform: translateY(-14px); }
    50% { transform: translateY(0); }
    65% { transform: translateY(-7px); }
    80% { transform: translateY(0); }
    100% { transform: translateY(0); }
  }

  /* Teaser bubble */
  #wsvc-teaser {
    position: absolute;
    right: 0;
    bottom: 76px;
    max-width: 240px;
    background: var(--wsvc-primary-dark);
    color: #fff;
    padding: 12px 30px 12px 14px;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.4;
    box-shadow: 0 4px 14px rgba(0,0,0,0.22);
    cursor: pointer;
    display: none;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.25s ease, transform 0.25s ease, bottom 0.25s ease;
  }
  #wsvc-teaser.wsvc-show { display: block; opacity: 1; transform: translateY(0); }
  #wsvc-teaser::after {
    content: "";
    position: absolute;
    bottom: -8px;
    right: 26px;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid var(--wsvc-primary-dark);
  }
  #wsvc-teaser-close {
    position: absolute;
    top: -6px;
    left: -6px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    color: #333;
    border: 1px solid #ddd;
    font-size: 12px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }

  @media (max-width: 420px) {
    #wsvc-teaser { max-width: 170px; font-size: 12px; padding: 10px 24px 10px 12px; }
  }

  /* Card */
  #wsvc-card {
    display: none;
    width: 360px;
    max-width: calc(100vw - 24px);
    height: 560px;
    max-height: calc(100vh - 110px);
    background: var(--wsvc-bg);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    margin-bottom: 14px;
    overflow: hidden;
    flex-direction: column;
  }
  #wsvc-card.wsvc-open { display: flex; }

  #wsvc-header {
    background: var(--wsvc-primary);
    color: #fff;
    padding: 14px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  #wsvc-header .wsvc-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  #wsvc-header .wsvc-avatar img { width: 100%; height: 100%; object-fit: contain; }
  #wsvc-header-text { flex: 1; min-width: 0; }
  #wsvc-header-name { font-weight: 700; font-size: 14.5px; display: flex; align-items: center; gap: 6px; }
  #wsvc-status-dot { width: 8px; height: 8px; border-radius: 50%; background: #7CFC9C; flex-shrink: 0; display: inline-block; }
  #wsvc-status-dot.wsvc-closed { background: #b8bcc4; }
  #wsvc-header-sub { font-size: 11.5px; opacity: 0.9; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #wsvc-header-emergency {
    background: var(--wsvc-danger);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  #wsvc-close {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 26px; height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }

  @media (max-width: 400px) {
    #wsvc-header { padding: 10px; gap: 6px; }
    #wsvc-header-name { font-size: 13px; }
    #wsvc-header-sub { font-size: 10px; }
    #wsvc-header-emergency { padding: 5px 6px; font-size: 9.5px; }
  }

  /* Menu view */
  #wsvc-menu {
    padding: 16px;
    overflow-y: auto;
    flex: 1;
  }
  #wsvc-menu-avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: #f2f4f7;
    margin: 4px auto 10px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #wsvc-menu-avatar img { width: 100%; height: 100%; object-fit: contain; }
  #wsvc-menu-greeting { text-align: center; font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  #wsvc-menu-sub { text-align: center; font-size: 12.5px; color: var(--wsvc-muted); margin-bottom: 6px; line-height: 1.4; }
  #wsvc-status-badge {
    display: block;
    text-align: center;
    font-size: 11.5px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    margin: 0 auto 14px;
    width: fit-content;
  }
  #wsvc-status-badge.wsvc-open-badge { background: #E4F8EA; color: #1B7A3D; }
  #wsvc-status-badge.wsvc-closed-badge { background: #F1F2F4; color: #666; }

  .wsvc-menu-btn {
    display: block;
    width: 100%;
    text-align: center;
    padding: 12px 14px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 10px;
    text-decoration: none;
    box-sizing: border-box;
  }
  #wsvc-emergency-menu-btn {
    background: var(--wsvc-danger);
    color: #fff;
  }
  #wsvc-start-chat-btn {
    background: var(--wsvc-primary);
    color: #fff;
  }
  #wsvc-book-btn {
    background: var(--wsvc-accent);
    color: #1c1c1c;
  }

  #wsvc-quick-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 4px 0 16px;
    justify-content: center;
  }
  .wsvc-chip {
    background: #f2f4f7;
    border: 1px solid var(--wsvc-border);
    border-radius: 20px;
    padding: 7px 12px;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--wsvc-text);
  }
  .wsvc-chip:hover { background: #e7eaee; }

  /* Chat view */
  #wsvc-chat {
    display: none;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }
  #wsvc-chat.wsvc-active { display: flex; }
  #wsvc-messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .wsvc-msg {
    max-width: 82%;
    padding: 10px 13px;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.45;
  }
  .wsvc-msg-bot {
    background: #f1f2f4;
    color: var(--wsvc-text);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .wsvc-msg-user {
    background: var(--wsvc-primary);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .wsvc-msg-links, .wsvc-msg-suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
    align-self: flex-start;
    max-width: 82%;
  }
  .wsvc-link-chip {
    background: var(--wsvc-primary);
    color: #fff !important;
    text-decoration: none;
    padding: 7px 12px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 600;
  }
  .wsvc-suggestion-chip {
    background: #fff;
    border: 1px solid var(--wsvc-primary);
    color: var(--wsvc-primary);
    padding: 7px 12px;
    border-radius: 16px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 600;
  }
  .wsvc-typing {
    align-self: flex-start;
    background: #f1f2f4;
    padding: 10px 15px;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    display: inline-flex;
    gap: 4px;
  }
  .wsvc-typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: #9aa0a8;
    display: inline-block;
    animation: wsvc-typing-kf 1s infinite ease-in-out;
  }
  .wsvc-typing span:nth-child(2) { animation-delay: 0.15s; }
  .wsvc-typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes wsvc-typing-kf {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  #wsvc-input-row {
    display: flex;
    gap: 8px;
    padding: 10px;
    border-top: 1px solid var(--wsvc-border);
    flex-shrink: 0;
  }
  #wsvc-input {
    flex: 1;
    border: 1px solid var(--wsvc-border);
    border-radius: 20px;
    padding: 10px 14px;
    font-size: 13.5px;
    outline: none;
  }
  #wsvc-input:focus { border-color: var(--wsvc-primary); }
  #wsvc-send {
    background: var(--wsvc-primary);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 40px; height: 40px;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 16px;
  }
  #wsvc-back-row {
    padding: 8px 10px 0;
  }
  #wsvc-back-btn {
    background: none;
    border: none;
    color: var(--wsvc-primary);
    font-size: 12.5px;
    cursor: pointer;
    font-weight: 600;
    padding: 4px 2px;
  }
</style>
</head>

  var GREETINGS = ["hi", "hello", "hey", "good morning", "good afternoon", "good evening"];

  function normalize(str) {
    return (str || "").toLowerCase().trim();
  }

  function matchEmergency(text) {
    var t = normalize(text);
    for (var i = 0; i < EMERGENCY_TRIGGERS.length; i++) {
      if (t.indexOf(EMERGENCY_TRIGGERS[i]) !== -1) return true;
    }
    return false;
  }

  function matchSymptom(text) {
    var t = normalize(text);
    for (var i = 0; i < SYMPTOM_TRIGGERS.length; i++) {
      if (t.indexOf(SYMPTOM_TRIGGERS[i]) !== -1) return true;
    }
    return false;
  }

  function matchKB(text) {
    var t = normalize(text);
    var best = null, bestScore = 0;
    for (var i = 0; i < KB.length; i++) {
      var entry = KB[i];
      for (var j = 0; j < entry.triggers.length; j++) {
        var trig = entry.triggers[j];
        if (t.indexOf(trig) !== -1 && trig.length > bestScore) {
          best = entry;
          bestScore = trig.length;
        }
      }
    }
    return best;
  }

  function matchGreeting(text) {
    var t = normalize(text);
    for (var i = 0; i < GREETINGS.length; i++) {
      if (t === GREETINGS[i] || t.indexOf(GREETINGS[i]) === 0) return true;
    }
    return false;
  }

  // Central answer function used by both free chat and the test harness.
  function matchMessage(text) {
    var status = wsvcGetStatus();
    if (matchEmergency(text)) {
      return {
        intentId: "emergency",
        html: "This sounds like it could be an emergency. Please <b>call us right away at " +
          '<a href="' + status.emergencyPhoneTel + '">' + status.emergencyPhone + "</a></b> — " +
          status.emergencyNote + " Don't wait for a chat reply.",
        links: [{ label: "📞 Call " + status.emergencyPhone, url: status.emergencyPhoneTel }],
        suggestions: []
      };
    }
    if (matchSymptom(text)) {
      return {
        intentId: "symptom",
        html: "I can't diagnose that over chat, so it's best to have one of our vets take a look. Give us a call on <b>" +
          _CONFIG.phone + "</b> or book a visit. If things get worse quickly, please treat it as an emergency and get in touch immediately.",
        links: [{ label: "📞 Call " + _CONFIG.phone, url: _CONFIG.phoneTel }],
        suggestions: ["How do I book an appointment?"]
      };
    }
    var entry = matchKB(text);
    if (entry) {
      var links = (entry.links || []).map(function (l) {
        var url = l.url;
        if (l.useBookingUrl) url = _CONFIG.bookingUrl;
        if (!url && l.label && l.label.indexOf("Directions") !== -1) url = _CONFIG.mapsUrl;
        return { label: l.label, url: url };
      });
      return { intentId: entry.id, html: entry.answer, links: links, suggestions: [] };
    }
    if (matchGreeting(text)) {
      return {
        intentId: "greeting",
        html: "Hello! How can I help — I can answer questions about hours, booking, services, payments and more.",
        links: [],
        suggestions: ["What are your hours?", "How do I book an appointment?"]
      };
    }
    return {
      intentId: "fallback",
      html: "I'm not sure about that one — for anything I can't answer, the team at " + _CONFIG.phone + " will be able to help directly.",
      links: [{ label: "📞 Call " + _CONFIG.phone, url: _CONFIG.phoneTel }],
      suggestions: ["What services do you offer?", "What are your hours?"]
    };
  }

  function positionTeaser() {

      teaser.style.bottom = (cardHeight + 14 + 76) + "px";

      teaser.style.bottom = "76px";

    if (teaserDismissed) return;
    els.wsvc_teaser.classList.add("wsvc-show");

  }

  var teaserDismissed = false;

  function bounceLauncher() {
    if (cardOpen) return;
    els.wsvc_launcher.classList.remove("wsvc-bounce");

    void els.wsvc_launcher.offsetWidth;
    els.wsvc_launcher.classList.add("wsvc-bounce");
  }

  function openCard() {
    cardOpen = true;
    els.wsvc_card.classList.add("wsvc-open");
    // Opening the menu hides the teaser bubble for good (per Glenda's request) —
    // it's done its job of drawing the visitor in.
    teaserDismissed = true;
    els.wsvc_teaser.classList.remove("wsvc-show");
    positionTeaser();
  }
  function closeCard() {
    cardOpen = false;
    els.wsvc_card.classList.remove("wsvc-open");
    positionTeaser();
  }

  function showMenuView() {
    els.wsvc_menu.style.display = "block";
    els.wsvc_chat.classList.remove("wsvc-active");

    els.wsvc_menu.style.display = "none";
    els.wsvc_chat.classList.add("wsvc-active");

  function appendMessage(role, html, links, suggestions) {
    var wrap = document.createElement("div");
    wrap.className = "wsvc-msg " + (role === "user" ? "wsvc-msg-user" : "wsvc-msg-bot");
    wrap.innerHTML = html;
    els.wsvc_messages.appendChild(wrap);

    if (links && links.length) {
      var linkWrap = document.createElement("div");
      linkWrap.className = "wsvc-msg-links";
      links.forEach(function (l) {
        if (!l.url) return;
        var a = document.createElement("a");
        a.href = l.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.className = "wsvc-link-chip";
        a.textContent = l.label;
        linkWrap.appendChild(a);
      });
      if (linkWrap.children.length) els.wsvc_messages.appendChild(linkWrap);
    }
    if (suggestions && suggestions.length) {
      var sugWrap = document.createElement("div");
      sugWrap.className = "wsvc-msg-suggestions";
      suggestions.forEach(function (s) {
        var btn = document.createElement("button");
        btn.className = "wsvc-suggestion-chip";
        btn.textContent = s;
        btn.addEventListener("click", function () { handleUserText(s); });
        sugWrap.appendChild(btn);
      });
      els.wsvc_messages.appendChild(sugWrap);
    }
    els.wsvc_messages.scrollTop = els.wsvc_messages.scrollHeight;
  }

  function showTyping() {
    var t = document.createElement("div");
    t.className = "wsvc-typing";
    t.id = "wsvc-typing-indicator";
    t.innerHTML = "<span></span><span></span><span></span>";
    els.wsvc_messages.appendChild(t);
    els.wsvc_messages.scrollTop = els.wsvc_messages.scrollHeight;
  }
  function hideTyping() {
    var t = $("wsvc-typing-indicator");
    if (t) t.remove();
  }

  function botReply(html, links, suggestions) {
    showTyping();
    setTimeout(function () {
      hideTyping();
      appendMessage("bot", html, links, suggestions);
    }, 500);
  }

  function handleUserText(text) {
    if (!text || !text.trim()) return;
    appendMessage("user", escapeHtml(text));

    if (onboardingStage === "name") {
      ownerName = text.trim();
      onboardingStage = "petname";
      botReply("Lovely to meet you, " + escapeHtml(ownerName) + "! What's your pet's name?", [], []);
      return;
    }
    if (onboardingStage === "petname") {
      petName = text.trim();
      onboardingStage = "condition";
      botReply(
        "Great — and what's going on with " + escapeHtml(petName) +
        " today? You can describe what's happening, or just ask me about booking, hours, services and more.",
        [], []
      );
      return;
    }
    if (onboardingStage === "condition") {
      onboardingStage = "done";
      var result = matchMessage(text);
      var prefix = "Thanks, " + escapeHtml(ownerName) + " — noted for " + escapeHtml(petName) + ". ";
      showTyping();
      setTimeout(function () {
        hideTyping();
        appendMessage("bot", prefix + result.html, result.links, result.suggestions);
      }, 500);
      return;
    }

    // Normal free-form matching (post-onboarding, or via quick chip)
    var result = matchMessage(text);
    botReply(result.html, result.links, result.suggestions);
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function startNewChat() {
    showChatView();
    els.wsvc_messages.innerHTML = "";
    onboardingStage = "name";
    botReply("Before we dive in, what's your name?", [], []);
  }

  function startQuickIntent(question) {
    showChatView();
    els.wsvc_messages.innerHTML = "";
    onboardingStage = "done"; // quick chips skip intake entirely
    appendMessage("user", escapeHtml(question));
    var result = matchMessage(question);
    botReply(result.html, result.links, result.suggestions);
  }

  function init() {

      closeCard();
    });

      if (e.target === els.wsvc_teaser_close) return;
      openCard();
      showMenuView();
    });

      e.stopPropagation();

    });
    els.wsvc_start_chat_btn.addEventListener("click", startNewChat);
    els.wsvc_back_btn.addEventListener("click", function () { showMenuView(); });
    els.wsvc_send.addEventListener("click", function () {
      var val = els.wsvc_input.value;
      els.wsvc_input.value = "";
      handleUserText(val);
    });
    els.wsvc_input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        var val = els.wsvc_input.value;
        els.wsvc_input.value = "";
        handleUserText(val);
      }
    });

    // Proactive teaser bubble ~1.8s after load
    setTimeout(function () {
      els.wsvc_teaser_text.textContent = "I'm " + _CONFIG.assistantName + ", here to help 24/7.";
      showTeaser();
    }, 1800);

    // Idle bounce every ~8s while closed
    bounceTimer = setInterval(bounceLauncher, 8000);

    // Recompute open/closed status every 60s
    statusTimer = setInterval(renderStatus, 60000);

    window.addEventListener("resize", positionTeaser);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  var WSVC_TEST = {
    cases: [
      { name: "species pricing - cat consult", input: "how much for a cat consult", expectIntentId: "payment" },
      { name: "species pricing - dog checkup", input: "dog checkup cost", expectIntentId: "payment" },

      { name: "non-emergency symptom", input: "my dog has a fever", expectIntentId: "symptom", expectNotContains: "call us right away" },
      { name: "bare contact phrasing", input: "contact number", expectIntentId: "contact" },

      { name: "booking", input: "how do i book an appointment", expectIntentId: "booking" },

      { name: "vaccination question", input: "do you offer vaccine", expectIntentId: "vaccination" },
      { name: "microchip question", input: "do you do microchipping", expectIntentId: "microchip" },
      { name: "final care question", input: "do you offer euthanasia", expectIntentId: "final_care" },
      { name: "general surgery question", input: "do you do surgery", expectIntentId: "surgery" }
    ],
    runAll: function () {
      var results = [];
      var passCount = 0;
      WSVC_TEST.cases.forEach(function (c) {
        var res = matchMessage(c.input);
        var pass = true;
        var reasons = [];
        if (c.expectIntentId && res.intentId !== c.expectIntentId) {
          pass = false;
          reasons.push("expected intent '" + c.expectIntentId + "' got '" + res.intentId + "'");
        }
        if (c.expectContains && res.html.toLowerCase().indexOf(c.expectContains.toLowerCase()) === -1) {
          pass = false;
          reasons.push("expected to contain '" + c.expectContains + "'");
        }
        if (c.expectNotContains && res.html.toLowerCase().indexOf(c.expectNotContains.toLowerCase()) !== -1) {
          pass = false;
          reasons.push("expected NOT to contain '" + c.expectNotContains + "'");
        }
        if (pass) passCount++;
        results.push({ name: c.name, input: c.input, pass: pass, reasons: reasons, intentId: res.intentId });
        console.log((pass ? "PASS" : "FAIL") + " — " + c.name + (pass ? "" : " (" + reasons.join("; ") + ")"));
      });
      var statusCheck = wsvcGetStatus();
      var statusOk = typeof statusCheck.open === "boolean" && !!statusCheck.emergencyLabel && !!statusCheck.emergencyPhone;
      console.log((statusOk ? "PASS" : "FAIL") + " — dynamic status function well-formed");
      console.log(passCount + " / " + WSVC_TEST.cases.length + " message cases passed");
      return { results: results, passCount: passCount, total: WSVC_TEST.cases.length, statusOk: statusOk };
    }
  };
